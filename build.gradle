import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.openapi.generator' version '7.3.0'
}

group = "pl.coupon.app"
version = "0.0.1-SNAPSHOT"
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'jakarta.validation:jakarta.validation-api'

    implementation "com.querydsl:querydsl-jpa::jakarta"
    annotationProcessor "com.querydsl:querydsl-apt::jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation 'org.flywaydb:flyway-core:9.22.3'

    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:jdbc'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
}

tasks.register("generateFrontendApi", GenerateTask) {
    generatorName = "spring"
    inputSpec = "$rootDir/open-api/frontend-api.yaml"
    outputDir = "$buildDir/generated/frontendApi"
    apiPackage = "pl.coupon.app.frontend.api"
    apiPackage = "pl.coupon.app.frontend.api"
    modelPackage = "pl.coupon.app.frontend.model"
    invokerPackage = "pl.coupon.app.frontend.invoker"
    modelNameSuffix = "Rest"
    cleanupOutput = true
    configOptions = [
            interfaceOnly: "true",
            additionalModelTypeAnnotations: "",
            useSpringBoot3: "true",
            annotationLibrary: "swagger2",
            documentationProvider: "springdoc",
            useTags: "true"
    ]
}

compileJava.dependsOn tasks.named("generateFrontendApi")

sourceSets {
    main {
        java {
            srcDir("$buildDir/generated/frontendApi/src/main/java")
        }
    }
}

task packContractFiles(type: Tar) {
    into('/') {
        from 'open-api/'
        include '*.yaml'
    }

    archiveAppendix = "open-api"
    destinationDirectory = file('build/open-api')
    compression = Compression.GZIP
}


test {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}
