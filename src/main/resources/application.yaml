spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/coupon
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

geoip:
  url: http://ip-api.com/json/{ip}?fields=status,message,countryCode
  timeout:
    connect: 2s
    read: 2s